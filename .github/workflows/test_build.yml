name: Test and Build

# See: RELEASE_MANAGEMENT_GUIDE.md § Pipelines for trigger behaviour.

on:
    pull_request:
        branches:
            - main
        paths:
            - 'src/**'
            - 'package.json'
            - 'yarn.lock'
            - 'tsconfig.json'
            - 'webpack.config.cjs'
            - 'jest.config.js'
            - 'Dockerfile'
            - '.github/workflows/test_build.yml'

# `pull-requests: write` is required by `artiomtr/jest-coverage-report-action`
# to post the coverage comment on the PR; `contents: read` is the minimum for
# checkout.
permissions:
    contents: read
    pull-requests: write

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install

            - name: Check formatting
              run: yarn format:check

            - name: Check linting
              run: yarn lint:check

            - name: Run unit tests
              run: yarn test:ci

            - name: Coverage
              uses: artiomtr/jest-coverage-report-action@v2
              with:
                  test-script: yarn jest
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  coverage-file: report.json
                  base-coverage-file: report.json
                  threshold: 80

            - name: Build
              run: yarn build

            - name: Run e2e tests
              run: yarn test:e2e:ci
