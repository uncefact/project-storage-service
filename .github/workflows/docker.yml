name: Docker

# See: RELEASE_MANAGEMENT_GUIDE.md § Pipelines for trigger behaviour.

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'package.json'
            - 'yarn.lock'
            - 'Dockerfile'
            - 'tsconfig.json'
            - 'webpack.config.cjs'
            - '.github/workflows/docker.yml'
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Semver version to tag this build with (e.g. 4.0.0). Omit to push only the branch tags.'
                required: false
                type: string

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        if: github.repository_owner == 'uncefact'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Pin to the SHA that triggered the workflow so a parallel push
                  # to main (or a re-tag) cannot move the working tree under us.
                  ref: ${{ github.sha }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
                      type=sha,format=short,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
                      type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-pre') }}
                      type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
                      type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && !contains(inputs.version, '-rc') && !contains(inputs.version, '-alpha') && !contains(inputs.version, '-beta') && !contains(inputs.version, '-pre') }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=docker-storage-service
                  cache-to: type=gha,scope=docker-storage-service,mode=max
